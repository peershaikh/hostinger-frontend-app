<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background: rounded square, brand blue -->
  <rect width="32" height="32" rx="7" fill="#2563EB"/>

  <!-- Train track / route line — horizontal bar -->
  <rect x="5" y="20" width="22" height="2.5" rx="1.25" fill="white" opacity="0.25"/>

  <!-- Left wheel -->
  <circle cx="9" cy="22.25" r="2.25" fill="white" opacity="0.5"/>
  <!-- Right wheel -->
  <circle cx="23" cy="22.25" r="2.25" fill="white" opacity="0.5"/>

  <!-- Train body -->
  <rect x="6" y="11" width="20" height="10" rx="3" fill="white"/>

  <!-- Cabin window — left -->
  <rect x="9" y="13.5" width="5" height="4.5" rx="1.5" fill="#2563EB"/>
  <!-- Cabin window — right -->
  <rect x="18" y="13.5" width="5" height="4.5" rx="1.5" fill="#2563EB"/>

  <!-- Speed line accent — top left of train -->
  <rect x="4" y="13" width="3" height="1.5" rx="0.75" fill="white" opacity="0.6"/>
  <rect x="3" y="15.5" width="4" height="1.5" rx="0.75" fill="white" opacity="0.4"/>
  <rect x="4" y="18" width="3" height="1.5" rx="0.75" fill="white" opacity="0.25"/>
</svg>
